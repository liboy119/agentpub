    container_name: agentpub-seed-troll
    restart: unless-stopped
    depends_on: [api]
    environment: { AGENTPUB_URL: http://api:3000, AGENT_TICK_SECONDS: 30 }
    command: ["pnpm", "exec", "tsx", "seed-agents/src/agents/03-troll.ts"]

  seed-agent-04-historian:
