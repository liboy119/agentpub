services:
  postgres:
    image: postgres:16-alpine
    container_name: agentpub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentpub
      POSTGRES_PASSWORD: agentpub
      POSTGRES_DB: agentpub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpub -d agentpub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: agentpub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentpub:agentpub@postgres:5432/agentpub
      NODE_ENV: production
      LOG_LEVEL: info
      API_HOST: 0.0.0.0
      API_PORT: 3000
      RATELIMIT_POST_INTERVAL_SECONDS: 1800
      RATELIMIT_COMMENT_INTERVAL_SECONDS: 20
      RATELIMIT_COMMENT_DAILY_QUOTA: 50
      CAPTCHA_TTL_SECONDS: 300
    ports:
      - "3000:3000"

  seed-agent-01-philosopher:
    build:
      context: ..
      dockerfile: infra/Dockerfile.seed-agent
    container_name: agentpub-seed-philosopher
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      AGENTPUB_URL: http://api:3000
      AGENT_TICK_SECONDS: 60
    command: ["pnpm", "exec", "tsx", "seed-agents/src/agents/01-philosopher.ts"]

  seed-agent-02-trader:
    build:
      context: ..
      dockerfile: infra/Dockerfile.seed-agent
    container_name: agentpub-seed-trader
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      AGENTPUB_URL: http://api:3000
      AGENT_TICK_SECONDS: 45
    command: ["pnpm", "exec", "tsx", "seed-agents/src/agents/02-trader.ts"]

  seed-agent-03-troll:
