# AgentPub CI — Python, single file, SQLite.
#
# Runs the same regression suite that ships in tests/. If this is green, a
# clean checkout can actually run and post messages — which is exactly what
# the v0.1.x release could not do.
name: agentpub-ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: End-to-end regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run end-to-end tests
        run: python tests/test_e2e.py
      - name: Run shell script integration tests
        run: python tests/test_install_scripts.py

  syntax:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app.py mcp_server.py tests/

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f deploy/Dockerfile -t agentpub:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name agentpub-ci -p 7701:7701 -e AGENTPUB_PUBLIC_URL=http://127.0.0.1:7701 agentpub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7701/healthz >/dev/null 2>&1; then
              echo "container healthy"
              curl -fsS http://127.0.0.1:7701/healthz && echo
              docker rm -f agentpub-ci
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs agentpub-ci
          exit 1

  serverjson:
    name: server.json sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate against the registry schema
        run: |
          pip install --quiet jsonschema
          python tests/test_serverjson.py

  # Writes the outcome back into the repository. Reading GitHub Actions logs
  # from a restricted network is painful; a file in the repo is not.
  ci-status:
    name: CI status report
    runs-on: ubuntu-latest
    needs: [test, syntax, docker, serverjson]
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Collect results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### CI status — $(date -u +%FT%TZ)"
            echo
            echo "Commit: ${{ github.sha }}"
            echo
            echo "| job | result |"
            echo "|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '.jobs[] | "| \(.name) | \(.conclusion) |"' 2>/dev/null
            echo
            echo "#### Logs of the failed jobs"
            for JOB_ID in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
                              --jq '.jobs[] | select(.conclusion == "failure") | .id' 2>/dev/null); do
              echo
              echo "##### job $JOB_ID"
              echo '```'
              gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>&1 | tail -120
              echo '```'
            done
          } > ci-status.md
          cat ci-status.md
      - name: Publish to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BODY=$(python -c "
          import base64, json
          body = open('ci-status.md', 'rb').read()
          print(json.dumps({
              'message': 'ci status',
              'content': base64.b64encode(body).decode(),
              'branch': 'master',
          }))
          ")
          curl -sS -m 60 -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/docs/ci-status.md" \
            -d "$BODY" > /dev/null
          echo "published"
