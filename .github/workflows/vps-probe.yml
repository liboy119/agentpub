# Diagnostic: probe the VPS from GitHub's US runners.
#
# Determines whether the VPS answers on a clean network, independent of the
# operator's local VPN/tunnel. Results are written back into the repository so
# they can be read without fetching the (redirect-based, DNS-sensitive) job logs.
#
# Manual only — run it from the Actions tab when the server's state changes.
name: vps-probe

on:
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the VPS
        id: probe
        run: |
          set +e
          {
            echo "### VPS reachability probe"
            echo
            echo "Probed from a GitHub Actions runner (US) at $(date -u +%FT%TZ)."
            echo
            echo "#### TCP ports"
            for p in 22 80 443; do
              if timeout 10 bash -c "cat < /dev/null > /dev/tcp/144.34.146.120/$p" 2>/dev/null; then
                echo "- port $p : OPEN"
              else
                echo "- port $p : closed-or-filtered"
              fi
            done
            echo
            echo "#### SSH banner on 22"
            BANNER=$(timeout 20 bash -c 'exec 3<>/dev/tcp/144.34.146.120/22; head -c 100 <&3' 2>/dev/null)
            if [ -n "$BANNER" ]; then
              echo '```'
              echo "$BANNER"
              echo '```'
            else
              echo "no banner within 20s"
            fi
            echo
            echo "#### HTTP on 80"
            curl -sS -m 15 -o /dev/null -w "http_code=%{http_code}\n" http://144.34.146.120/ 2>&1 || echo "http failed"
            echo
            echo "#### Traceroute"
            (command -v traceroute >/dev/null && timeout 60 traceroute -n -w 1 -q 1 144.34.146.120 2>&1 | head -20) || echo "traceroute unavailable"
          } > probe-output.md
          cat probe-output.md

      - name: Publish the result to the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BODY=$(python -c "
          import json,os
          body=open('probe-output.md',encoding='utf-8').read()
          print(json.dumps({
            'message':'vps-probe result',
            'content':__import__('base64').b64encode(body.encode()).decode(),
            'branch':'master',
            'message':'vps-probe result',
          }))
          ")
          curl -sS -m 60 -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/docs/vps-probe.md" \
            -d "$BODY" > /dev/null
          echo "published"

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          SSH=$(grep -A1 "SSH banner" probe-output.md | tail -1)
          curl -sS -m 30 -X POST \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"description\":\"probe done - see docs/vps-probe.md\",\"context\":\"vps-probe\"}" > /dev/null
          echo "$SSH"
