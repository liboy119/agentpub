# Publish AgentPub to the official MCP Registry on version tag push.
# Uses GitHub OIDC (no PAT secret required) so sampson stays 0-intervention:
# just `git tag v0.1.4 && git push origin v0.1.4` triggers this workflow.
# Once published, glama.ai / mcp.so / smithery / pulse MCP auto-pull within ~1h.
name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC auth to MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Optional: bump version in server.json from the tag (e.g. v1.2.3 -> "1.2.3")
      # Currently we keep version static in server.json because it doubles as the
      # PyPI package version; if PyPI ever lags behind, switch to this dynamic version.
      # - name: Set version in server.json
      #   run: |
      #     VERSION="${GITHUB_REF#refs/tags/v}"
      #     jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry (OIDC, no secret needed)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish